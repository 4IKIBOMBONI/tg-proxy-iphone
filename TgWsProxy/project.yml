name: TgWsProxy
options:
  bundleIdPrefix: com.tgwsproxy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # Generated by Apple when you sign in with your developer account.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Single source of truth for bundle ids. Change this to something your
    # Apple Developer account owns; the tunnel id is always APP_ID_BASE.tunnel
    # so the "embedded binary must be prefixed by the app" rule always holds.
    APP_ID_BASE: com.tgwsproxy.mobileapp

packages: {}

targets:
  # ---------------------------------------------------------------- App
  TgWsProxy:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID_BASE)
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/TgWsProxy.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Shared/TgWsProxyCore-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: ["-lresolv"]
    dependencies:
      - framework: ../core/build/TgWsProxyCore.xcframework
        embed: false
      - target: Tunnel
      - target: ControlExtension
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: NetworkExtension.framework
      - sdk: AppIntents.framework
      - sdk: WidgetKit.framework

  # ---------------------------------------------------- Packet Tunnel ext
  Tunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID_BASE).tunnel
        INFOPLIST_FILE: Tunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tunnel/Tunnel.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Shared/TgWsProxyCore-Bridging-Header.h
        OTHER_LDFLAGS: ["-lresolv"]
        # Tunnel doesn't expose any AppShortcuts to Siri; skip the Siri SSU
        # training build phase so it can't fail on an unrelated extension.
        LM_ENABLE_LINK_GENERATION_AT_DEPLOY: "NO"
    dependencies:
      - framework: ../core/build/TgWsProxyCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: NetworkExtension.framework

  # ---------------------------------------------------- Control Widget ext
  # iOS 18 Control Center widget that exposes a start/stop toggle. Built as a
  # plain ExtensionKit / WidgetKit extension; only ships Swift code that
  # touches AppIntents + NetworkExtension (NETunnelProviderManager), no Go core.
  ControlExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ControlExtension
      - path: Shared
        excludes:
          - ProxyCore.swift
          - TgWsProxyCore-Bridging-Header.h
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID_BASE).control
        INFOPLIST_FILE: ControlExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ControlExtension/ControlExtension.entitlements
        # The control widget's SetValueIntent is invoked by the system through
        # the widget binding, not via Siri / Shortcuts. Disable the Siri SSU
        # training phase for this target — it tries to parse the widget
        # extension's Info.plist and fails ("Unable to parse Info.plist")
        # because widget-style Info.plists don't carry the keys the SSU
        # processor expects. The intents themselves still work.
        LM_ENABLE_LINK_GENERATION_AT_DEPLOY: "NO"
    dependencies:
      - sdk: NetworkExtension.framework
      - sdk: AppIntents.framework
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

schemes:
  TgWsProxy:
    build:
      # Order matters: the app target must be first so XcodeGen wires the
      # scheme as an application launch (not as an "extension debug" launch,
      # which would set wasCreatedForAppExtension=YES and pick the .appex as
      # the runnable, leaving installd to reject the app bundle).
      targets:
        TgWsProxy: all
        Tunnel: all
        ControlExtension: all
    run:
      config: Debug
      executable: TgWsProxy
    profile:
      config: Release
      executable: TgWsProxy
    archive:
      config: Release
