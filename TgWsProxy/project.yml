name: TgWsProxy
options:
  bundleIdPrefix: com.tgwsproxy
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # Generated by Apple when you sign in with your developer account.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages: {}

targets:
  # ---------------------------------------------------------------- App
  TgWsProxy:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tgwsproxy.app
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/TgWsProxy.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Shared/TgWsProxyCore-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: ["-lresolv"]
    dependencies:
      - framework: ../core/build/TgWsProxyCore.xcframework
        embed: false
      - target: Tunnel
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: NetworkExtension.framework

  # ---------------------------------------------------- Packet Tunnel ext
  Tunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tgwsproxy.app.tunnel
        INFOPLIST_FILE: Tunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tunnel/Tunnel.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Shared/TgWsProxyCore-Bridging-Header.h
        OTHER_LDFLAGS: ["-lresolv"]
    dependencies:
      - framework: ../core/build/TgWsProxyCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: NetworkExtension.framework

schemes:
  TgWsProxy:
    build:
      targets:
        TgWsProxy: all
        Tunnel: all
    run:
      config: Debug
