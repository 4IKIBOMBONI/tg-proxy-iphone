name: TgWsProxy
options:
  bundleIdPrefix: com.tgwsproxy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # Generated by Apple when you sign in with your developer account.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Single source of truth for bundle ids. Change this to something your
    # Apple Developer account owns; the tunnel id is always APP_ID_BASE.tunnel
    # so the "embedded binary must be prefixed by the app" rule always holds.
    APP_ID_BASE: com.tgwsproxy.app

packages: {}

targets:
  # ---------------------------------------------------------------- App
  TgWsProxy:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID_BASE)
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/TgWsProxy.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Shared/TgWsProxyCore-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: ["-lresolv"]
    dependencies:
      - framework: ../core/build/TgWsProxyCore.xcframework
        embed: false
      - target: Tunnel
      - target: ControlExtension
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: NetworkExtension.framework
      - sdk: AppIntents.framework

  # ---------------------------------------------------- Packet Tunnel ext
  Tunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID_BASE).tunnel
        INFOPLIST_FILE: Tunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tunnel/Tunnel.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Shared/TgWsProxyCore-Bridging-Header.h
        OTHER_LDFLAGS: ["-lresolv"]
    dependencies:
      - framework: ../core/build/TgWsProxyCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: NetworkExtension.framework

  # ---------------------------------------------------- Control Widget ext
  # iOS 18 Control Center widget that exposes a start/stop toggle. Built as a
  # plain ExtensionKit / WidgetKit extension; only ships Swift code that
  # touches AppIntents + NetworkExtension (NETunnelProviderManager), no Go core.
  ControlExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ControlExtension
      - path: Shared
        excludes:
          - ProxyCore.swift
          - TgWsProxyCore-Bridging-Header.h
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID_BASE).control
        INFOPLIST_FILE: ControlExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ControlExtension/ControlExtension.entitlements
    dependencies:
      - sdk: NetworkExtension.framework
      - sdk: AppIntents.framework
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

schemes:
  TgWsProxy:
    build:
      targets:
        TgWsProxy: all
        Tunnel: all
        ControlExtension: all
    run:
      config: Debug
